spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/inventory_db
    username: amihady
    password: amihady
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: inventoryId
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.type.mapping: >
          productCreatedEvent:kz.amihady.eccomerce.kafka.consumer.event.ProductCreatedEvent,
          productDeletedEvent:kz.amihady.eccomerce.kafka.consumer.event.ProductDeletedEvent,
          orderCanceledEvent:kz.amihady.eccomerce.kafka.consumer.event.OrderCanceledEvent,
          orderReserveRequestEvent:kz.amihady.eccomerce.kafka.consumer.event.OrderReserveRequestEvent,
          paymentInventoryEvent:kz.amihady.eccomerce.kafka.consumer.event.PaymentInventoryEvent
        spring.json.trusted.packages: kz.amihady.eccomerce.kafka.consumer.event.*

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: >
          inventoryUpdatedEvent:kz.amihady.eccomerce.kafka.producer.event.InventoryUpdatedEvent,
          orderReserveResponseEvent:kz.amihady.eccomerce.kafka.producer.event.OrderReserveResponseEvent
        spring.json.trusted.packages: kz.amihady.eccomerce.kafka.producer.event.*


logging:
  level:
    org.apache.kafka: ERROR
    org.springframework.kafka: ERROR

server:
  port: 8082

kafka:
  topics:
    product-created: "product-created"
    product-deleted: "product-deleted"
    inventory-updated: "inventory-updated"
    order-canceled: "order-canceled"
    order-reserve-request: "order-reserve-request"
    order-reserve-response: "order-reserve-response"
    payment-inventory: "payment-inventory"