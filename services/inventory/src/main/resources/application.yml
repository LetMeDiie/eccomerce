spring:
  application:
    name: inventory-service

  datasource:
    url: jdbc:postgresql://localhost:5432/inventory_db
    username: amihady
    password: amihady
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: productId
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.type.mapping: >
          productCreatedEvent:kz.amihady.eccomerce.kafka.event.ProductCreatedEvent,
          productDeletedEvent:kz.amihady.eccomerce.kafka.event.ProductDeletedEvent,
          orderPaid:kz.amihady.eccomerce.kafka.event.OrderPaidEvent
        spring.json.trusted.packages: kz.amihady.eccomerce.kafka.event

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: >
          inventoryUpdatedEvent:kz.amihady.eccomerce.kafka.event.InventoryUpdatedEvent


logging:
  level:
    org.apache.kafka: ERROR
    org.springframework.kafka: ERROR

server:
  port: 8083

kafka:
  topics:
    product-created: "product-created"
    product-deleted: "product-deleted"
    inventory-updated: "inventory-updated"
    order-paid: "order-paid"